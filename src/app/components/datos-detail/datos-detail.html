<div class="container-form">
    <h2>Información - Datos</h2>

    <p *ngIf="error()" class="error-message">{{ error() }}</p>

    <div class="form-grid">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" [(ngModel)]="dato.nombreDatos" [disabled]="esSoloLectura">
        </div>

        <div class="form-group">
            <label>Fecha de Nacimiento</label>
            <input type="date" [(ngModel)]="dato.fechaNacimientoDatos" [disabled]="esSoloLectura">
        </div>

        <div class="form-group">
            <label>Edad</label>
            <input type="number" [(ngModel)]="dato.edadDatos" [disabled]="esSoloLectura">
        </div>

        <div class="form-group">
            <label>Sexo</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="sexo" [value]="0" [(ngModel)]="dato.sexoDatos" [disabled]="esSoloLectura">
                    Mujer
                </label>
                <label>
                    <input type="radio" name="sexo" [value]="1" [(ngModel)]="dato.sexoDatos" [disabled]="esSoloLectura">
                    Hombre
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Correo</label>
            <input type="email" [(ngModel)]="dato.correoDatos" [disabled]="esSoloLectura">
        </div>
    </div>

    <div class="button-group">
        <button *ngIf="!esSoloLectura" class="btn-cyan" (click)="guardar()">Guardar</button>
        <button class="btn-cyan" routerLink="/dashboard">Regresar</button>
    </div>
</div>
